services:
  app:
    build:
      context: ../..
      target: development
    environment:
      APP_ENV: development
      DATABASE_PATH: /data/app.sqlite
      APP_ORIGIN: http://127.0.0.1:3010
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - ../..:/app
      - dev_node_modules:/app/node_modules
      - ../../.local/dev:/data
    restart: unless-stopped

volumes:
  dev_node_modules:
    name: chore_dev_node_modules
