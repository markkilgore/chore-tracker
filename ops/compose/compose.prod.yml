services:
  app:
    image: tidy-week:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to a tested Git SHA}
    init: true
    environment:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_PATH: /data/app.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8788}
    ports:
      - "${TIDY_BIND_ADDRESS:-127.0.0.1}:${TIDY_HOST_PORT:-8788}:3000"
    volumes:
      - ${TIDY_DATA_DIR:?Set an absolute production data directory}:/data
      - ${TIDY_ASSETS_DIR:?Set an absolute production assets directory}:/assets
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
